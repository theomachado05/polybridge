[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "polybridge-research"
version = "0.1.0"
description = "PolyBridge research: implied-move parity on 8-K events (GatorQuant Hacks 2026)"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2", "numpy>=2.0", "requests>=2.31", "matplotlib>=3.8", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "nbformat>=5.9"]

[tool.setuptools.packages.find]
include = ["polybridge_research*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "leadlag/tests", "leadlag_closed/tests", "leadlag_replication/tests", "arb/tests", "gap_model/tests", "open_options/tests", "closed_hedge/tests", "s1_twin_spread/tests", "s3_three_way/tests", "s4_linked_assets/tests", "s5_big_moves/tests", "linker/tests", "s6_monday_fade/tests", "s7_weekend_straddle/tests", "s8_open_referee/tests", "s9_weekend_price_markets/tests", "s14_link_ceiling/tests", "s15_weekend_scare/tests", "s16_kalshi_quotes/tests", "s10_weekend_lag/tests", "s11_bundles/tests", "s12_resting_orders/tests"]
