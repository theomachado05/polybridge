name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: cd research && uv venv .venv --python 3.10 && uv pip install --python .venv -e ".[dev]"
      - run: cd research && .venv/bin/python -m pytest -q

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: cd backend && uv sync --locked && uv run pytest -q

  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake -S engine/hedgecore -B engine/hedgecore/build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build engine/hedgecore/build
      - run: ctest --test-dir engine/hedgecore/build --output-on-failure
      - name: golden (pre-existing families byte-identical to the base commit)
        if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'
        run: engine/hedgecore/scripts/golden_diff.sh "${{ github.event.pull_request.base.sha || github.event.before }}"
      - run: cd backend && uv sync --locked --group engine && uv run pytest ../engine/hedgecore/tests -q
      - run: cd backend && uv run --locked --group engine pytest -q tests/test_bridges_engine.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: cd web && pnpm install --frozen-lockfile && pnpm lint && pnpm test && pnpm build
