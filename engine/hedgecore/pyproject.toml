[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "hedgecore"
version = "0.1.0"
requires-python = ">=3.12"

[tool.scikit-build]
cmake.version = ">=3.24"
cmake.define.HEDGECORE_BUILD_TESTS = "OFF"
cmake.define.HEDGECORE_BUILD_PYTHON = "ON"
wheel.packages = []
